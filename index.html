<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSSIM · 交互式数学课堂 · Interactive Math Lessons</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/hssim.css">
</head>
<body class="bg-slate-950 text-slate-200">
  <div class="min-h-screen flex flex-col">
    <div id="hssim-header"></div>

    <main class="flex-1">
      <!-- Hero -->
      <section class="relative overflow-hidden">
        <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[60rem] h-[40rem] bg-violet-600/20 rounded-full blur-3xl pointer-events-none"></div>
        <div class="max-w-7xl mx-auto px-6 pt-16 pb-12 relative">
          <div class="inline-flex items-center gap-x-2 px-3 py-1 rounded-full bg-slate-900 border border-slate-700 text-xs text-slate-400 mb-6 fade-in">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span data-i18n="hero_kicker">为北美 9–10 年级学生打造 · Built for Grade 9–10</span>
          </div>
          <h1 class="font-display text-4xl sm:text-5xl lg:text-6xl font-bold tracking-tighter max-w-3xl fade-in" data-i18n="hero_title">
            把数学变成可以亲手拨动的东西
          </h1>
          <p class="mt-5 text-base sm:text-lg text-slate-400 max-w-2xl leading-relaxed fade-in" data-i18n="hero_subtitle">
            HSSIM 是一系列持续更新的交互式数学课堂。每一课都可拖拽、可动画、配有实时公式，并提供完整中英文对照。
          </p>
          <div class="mt-7 flex flex-wrap items-center gap-3 fade-in">
            <a href="bezier.html" class="px-5 py-2.5 rounded-2xl bg-violet-600 hover:bg-violet-500 text-white text-sm font-medium flex items-center gap-x-2 transition-colors">
              <i class="fa-solid fa-play"></i><span data-i18n="hero_cta_primary">从贝塞尔曲线开始</span>
            </a>
            <a href="#lessons" class="px-5 py-2.5 rounded-2xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm font-medium flex items-center gap-x-2 transition-colors">
              <i class="fa-solid fa-layer-group"></i><span data-i18n="hero_cta_secondary">浏览全部课程</span>
            </a>
          </div>

          <!-- What HSSIM means -->
          <div class="mt-10 grid grid-cols-2 sm:grid-cols-4 gap-3 max-w-3xl">
            <div class="control-card bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <div class="font-display text-2xl font-bold text-violet-400">H</div>
              <div class="text-xs text-slate-400 mt-1" data-i18n="hssim_h">Help · 帮助</div>
            </div>
            <div class="control-card bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <div class="font-display text-2xl font-bold text-fuchsia-400">S</div>
              <div class="text-xs text-slate-400 mt-1" data-i18n="hssim_s1">Sunday · 我的女儿</div>
            </div>
            <div class="control-card bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <div class="font-display text-2xl font-bold text-emerald-400">S</div>
              <div class="text-xs text-slate-400 mt-1" data-i18n="hssim_s2">Sharply · 飞速</div>
            </div>
            <div class="control-card bg-slate-900 border border-slate-800 rounded-2xl p-4">
              <div class="font-display text-2xl font-bold text-amber-400">IM</div>
              <div class="text-xs text-slate-400 mt-1" data-i18n="hssim_im">Improve Math · 提升数学</div>
            </div>
          </div>
        </div>
      </section>

      <!-- Lessons -->
      <section id="lessons" class="max-w-7xl mx-auto px-6 pt-6 pb-16">
        <div class="flex items-end justify-between flex-wrap gap-3 mb-8">
          <div>
            <div class="section-title mb-2" data-i18n="lessons_kicker">INTERACTIVE LESSONS</div>
            <h2 class="font-display text-2xl sm:text-3xl font-semibold tracking-tighter" data-i18n="lessons_title">交互式课程</h2>
          </div>
          <div id="lesson-count" class="text-xs text-slate-500 font-mono px-3 py-1 rounded-full bg-slate-900 border border-slate-700"></div>
        </div>

        <div id="lesson-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>
      </section>
    </main>

    <div id="hssim-footer"></div>
  </div>

  <script src="assets/hssim.js"></script>
  <script>
    // ---- page dictionary -------------------------------------------------
    HSSIM.registerDict({
      zh: {
        page_title: "HSSIM · 一堆好玩的东西",
        nav_title: "HSSIM 游乐场",
        nav_subtitle: "拖一拖，玩一玩，顺便变聪明",
        hero_kicker: "专门为高中生整的活儿 · 9–10 年级也能秒懂",
        hero_title: "原来这些东西，是能上手玩的玩具",
        hero_subtitle: "放轻松，这儿没有考试。拖一拖、点一点、按个播放，那些听起来很高大上的玩意儿自己就动起来了。中英文随你切。",
        hero_cta_primary: "先玩那条会拐弯的线",
        hero_cta_secondary: "看看都有啥",
        hssim_h: "Help · 帮助",
        hssim_s1: "Sunday · 我的女儿",
        hssim_s2: "Sharply · 飞速",
        hssim_im: "Improve Math · 提升数学",
        lessons_kicker: "随便挑一个开玩",
        lessons_title: "全部玩意儿",
        lesson_count: (n) => `${n} 个 · 还在悄悄加`,
        tag_algebra: "字母数字",
        tag_geometry: "形状",
        tag_trig: "圆圈与波浪",
        tag_stats: "运气",
        tag_fun: "纯好玩",
        cta_open: "进去玩 →",
      },
      en: {
        page_title: "HSSIM · a pile of fun stuff",
        nav_title: "HSSIM Playground",
        nav_subtitle: "drag stuff, have fun, get smarter",
        hero_kicker: "made for high-schoolers · zero boredom, promise",
        hero_title: "Turns out this stuff is basically a toy",
        hero_subtitle: "Relax — no tests here. Drag things, smash play, and the fancy-sounding stuff just comes to life on its own. Flip between English and 中文 whenever.",
        hero_cta_primary: "Play with the bendy line",
        hero_cta_secondary: "Show me everything",
        hssim_h: "Help",
        hssim_s1: "Sunday",
        hssim_s2: "Sharply",
        hssim_im: "Improve Math",
        lessons_kicker: "PICK ONE, GO WILD",
        lessons_title: "The whole toy box",
        lesson_count: (n) => `${n} toys · more dropping soon`,
        tag_algebra: "letters & numbers",
        tag_geometry: "shapes",
        tag_trig: "circles & waves",
        tag_stats: "luck",
        tag_fun: "just fun",
        cta_open: "let's go →",
      },
    });

    // ---- lesson catalogue (add a line here to publish a new lesson) ------
    const LESSONS = [
      {
        file: "bezier.html", icon: "fa-bezier-curve", grad: "from-violet-500 to-fuchsia-500", tag: "tag_fun",
        zh: { title: "会拐弯的魔法线", desc: "拽几个点，线就乖乖跟着扭。设计师和动画师天天偷偷用它。" },
        en: { title: "The bendy magic line", desc: "Yank a few dots and the line obeys. Designers and animators secretly use this all day." },
      },
      {
        file: "parabola.html", icon: "fa-chart-line", grad: "from-sky-500 to-cyan-500", tag: "tag_algebra",
        zh: { title: "为啥扔出去的东西都这么飞", desc: "投篮、喷泉、愤怒的小鸟，飞出来的弧线都是它。拖一拖看它变胖变瘦。" },
        en: { title: "Why everything you throw flies like this", desc: "Basketballs, fountains, Angry Birds — they all fly along this curve. Drag it fat or skinny." },
      },
      {
        file: "linear-systems.html", icon: "fa-slash", grad: "from-emerald-500 to-teal-500", tag: "tag_algebra",
        zh: { title: "两条线的相遇现场", desc: "两条直线到底在哪儿撞上？那个交点就是答案——拖着玩马上懂。" },
        en: { title: "Two lines walk into a graph…", desc: "Where do two lines actually bump into each other? That crossing point is the punchline. Drag to find out." },
      },
      {
        file: "pythagoras.html", icon: "fa-vector-square", grad: "from-amber-500 to-orange-500", tag: "tag_geometry",
        zh: { title: "三角形的秘密暗号", desc: "古希腊人发现的三角形冷知识，用三个正方形当场给你证明。" },
        en: { title: "The triangle's secret handshake", desc: "An ancient-Greek flex about right triangles — proved on the spot with three real squares." },
      },
      {
        file: "trig.html", icon: "fa-wave-square", grad: "from-rose-500 to-pink-500", tag: "tag_trig",
        zh: { title: "转圈圈，转出波浪", desc: "让一个点绕圈跑，它的高度居然画出完美波浪。声音和信号都靠它。" },
        en: { title: "Spin a circle, get a wave", desc: "Send a dot around a circle and its height draws a perfect wave. Sound and signals run on this." },
      },
      {
        file: "transformations.html", icon: "fa-arrows-up-down-left-right", grad: "from-indigo-500 to-violet-500", tag: "tag_algebra",
        zh: { title: "给曲线做个整容", desc: "推一推、翻一翻、拉一拉，同一条线能玩出无数花样。" },
        en: { title: "Give a graph a glow-up", desc: "Push it, flip it, stretch it — one curve, endless remixes." },
      },
      {
        file: "probability.html", icon: "fa-dice", grad: "from-fuchsia-500 to-purple-500", tag: "tag_stats",
        zh: { title: "纯靠运气，居然也有规律", desc: "小球一路乱蹦，落下来却堆成漂亮的钟形山丘。原来运气也有套路。" },
        en: { title: "Pure chaos, weirdly organized", desc: "Balls bounce totally randomly, yet pile up into a tidy bell-shaped hill. Luck has a pattern." },
      },
      {
        file: "fibonacci.html", icon: "fa-spinner", grad: "from-lime-500 to-emerald-500", tag: "tag_fun",
        zh: { title: "大自然最偏爱的一串数字", desc: "向日葵、松果、台风、甚至股价，都在偷偷用同一串数字搭螺旋。" },
        en: { title: "Nature's favorite number trick", desc: "Sunflowers, pinecones, hurricanes, even stock charts secretly spiral with the same numbers." },
      },
      {
        file: "sierpinski.html", icon: "fa-shapes", grad: "from-cyan-500 to-blue-500", tag: "tag_fun",
        zh: { title: "掷骰子掷出一幅艺术品", desc: "规则简单到离谱：随机挑个角，走一半。结果却拼出超精致的图案。" },
        en: { title: "Roll dice, accidentally make art", desc: "Stupidly simple rules — pick a random corner, go halfway. Somehow it builds intricate art." },
      },
      {
        file: "unit-circle.html", icon: "fa-circle-notch", grad: "from-rose-500 to-pink-500", tag: "tag_trig",
        zh: { title: "转圈圈，转出波浪", desc: "让一个点绕圈跑，它的高度居然画出完美波浪。圆和波其实是同一回事。" },
        en: { title: "Spin a circle, get a wave", desc: "Send a dot around a circle and its height draws a perfect wave. A circle and a wave are the same thing." },
      },
      {
        file: "derivative.html", icon: "fa-chart-line", grad: "from-sky-500 to-indigo-500", tag: "tag_algebra",
        zh: { title: "陡不陡，谁说了算", desc: "把割线的间距慢慢缩到 0，它就贴成了切线——那条切线的斜率就是导数。" },
        en: { title: "What makes a curve steep", desc: "Shrink a secant's gap to zero and it snuggles into the tangent — that slope is the derivative." },
      },
      {
        file: "vectors.html", icon: "fa-arrows-up-down-left-right", grad: "from-emerald-500 to-sky-500", tag: "tag_geometry",
        zh: { title: "两个箭头怎么相加", desc: "首尾相接拼出第三个箭头，再看一个箭头在另一个上投下多长的影子。" },
        en: { title: "How two arrows add up", desc: "Stick them tip-to-tail for a third arrow, then watch the shadow one casts on the other." },
      },
      {
        file: "conics.html", icon: "fa-circle-half-stroke", grad: "from-amber-500 to-rose-500", tag: "tag_geometry",
        zh: { title: "切一刀，切出四种曲线", desc: "同一个圆锥，切的角度不同，切口就是圆、椭圆、抛物线或双曲线。" },
        en: { title: "One cut, four curves", desc: "One cone, different cut angles — circle, ellipse, parabola, or hyperbola." },
      },
    ];

    function renderLessons() {
      const grid = document.getElementById("lesson-grid");
      const lang = HSSIM.getLang();
      grid.innerHTML = LESSONS.map((l, i) => {
        const c = l[lang] || l.zh;
        return `
        <a href="${l.file}" class="lesson-card group bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col fade-in" style="animation-delay:${i * 40}ms">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${l.grad} flex items-center justify-center shadow-lg shadow-violet-500/20">
              <i class="fa-solid ${l.icon} text-white text-lg"></i>
            </div>
            <span class="text-[10px] font-medium tracking-wide px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-400">${HSSIM.t(l.tag)}</span>
          </div>
          <h3 class="font-display text-lg font-semibold tracking-tight mb-2">${c.title}</h3>
          <p class="text-sm text-slate-400 leading-relaxed flex-1">${c.desc}</p>
          <div class="mt-4 text-sm text-violet-400 flex items-center gap-x-2 group-hover:gap-x-3 transition-all">
            <span>${HSSIM.t("cta_open")}</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </div>
        </a>`;
      }).join("");

      document.getElementById("lesson-count").textContent = HSSIM.t("lesson_count", LESSONS.length);
    }

    // re-render cards whenever the language flips
    window.onLangChange = renderLessons;

    HSSIM.mount({ home: true, icon: "fa-infinity" });
    renderLessons();
  </script>
  <!-- tiny corner feedback widget (self-contained) -->
  <script src="assets/feedback.js" defer></script>
</body>
</html>
