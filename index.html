    // ---- the five categories, in display order ---------------------------
    const CATS = [
      { tag: "tag_algebra",  desc: "catdesc_algebra",  icon: "fa-superscript",         grad: "from-sky-500 to-cyan-500" },
      { tag: "tag_geometry", desc: "catdesc_geometry", icon: "fa-shapes",              grad: "from-amber-500 to-orange-500" },
      { tag: "tag_trig",     desc: "catdesc_trig",     icon: "fa-wave-square",         grad: "from-rose-500 to-pink-500" },
      { tag: "tag_stats",    desc: "catdesc_stats",    icon: "fa-dice",                grad: "from-fuchsia-500 to-purple-500" },
      { tag: "tag_fun",      desc: "catdesc_fun",      icon: "fa-wand-magic-sparkles", grad: "from-violet-500 to-fuchsia-500" },
    ];

    let viewMode = localStorage.getItem("hssim_view") || "all";

    function cardHTML(l, i) {
      const lang = HSSIM.getLang();
      const c = l[lang] || l.zh;
      return `
        <a href="${l.file}" class="lesson-card group bg-slate-900 border border-slate-800 rounded-3xl p-6 flex flex-col fade-in" style="animation-delay:${i * 40}ms">
          <div class="flex items-center justify-between mb-4">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br ${l.grad} flex items-center justify-center shadow-lg shadow-violet-500/20">
              <i class="fa-solid ${l.icon} text-white text-lg"></i>
            </div>
            <span class="text-[10px] font-medium tracking-wide px-2.5 py-1 rounded-full bg-slate-800 border border-slate-700 text-slate-400">${HSSIM.t(l.tag)}</span>
          </div>
          <h3 class="font-display text-lg font-semibold tracking-tight mb-1.5">${c.title}</h3>
          <div class="flex items-start gap-x-1.5 text-[11px] text-slate-500 mb-2.5 leading-snug">
            <i class="fa-solid fa-graduation-cap text-violet-400/70 mt-0.5"></i>
            <span>${(l.formal && (l.formal[lang] || l.formal.zh)) || ""}</span>
          </div>
          <p class="text-sm text-slate-400 leading-relaxed flex-1">${c.desc}</p>
          <div class="mt-4 text-sm text-violet-400 flex items-center gap-x-2 group-hover:gap-x-3 transition-all">
            <span>${HSSIM.t("cta_open")}</span>
            <i class="fa-solid fa-arrow-right text-xs"></i>
          </div>
        </a>`;
    }

    function renderLessons() {
      const grid = document.getElementById("lesson-grid");

      if (viewMode === "cat") {
        grid.className = "space-y-12";
        grid.innerHTML = CATS.map((cat) => {
          const items = LESSONS.filter((l) => l.tag === cat.tag);
          if (!items.length) return "";
          return `
          <section class="fade-in">
            <div class="flex items-center gap-x-3 mb-5">
              <div class="w-10 h-10 rounded-2xl bg-gradient-to-br ${cat.grad} flex items-center justify-center shadow-lg shadow-violet-500/20">
                <i class="fa-solid ${cat.icon} text-white text-sm"></i>
              </div>
              <div>
                <h3 class="font-display text-xl font-semibold tracking-tight">${HSSIM.t(cat.tag)}</h3>
                <p class="text-xs text-slate-500">${HSSIM.t(cat.desc)} · ${HSSIM.t("cat_count", items.length)}</p>
              </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">${items.map(cardHTML).join("")}</div>
          </section>`;
        }).join("");
      } else {
        grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5";
        grid.innerHTML = LESSONS.map(cardHTML).join("");
      }

      updateViewToggle();
      document.getElementById("lesson-count").textContent = HSSIM.t("lesson_count", LESSONS.length);
    }

    function updateViewToggle() {
      const all = document.getElementById("view-btn-all");
      const cat = document.getElementById("view-btn-cat");
      [[all, viewMode === "all"], [cat, viewMode === "cat"]].forEach(([btn, on]) => {
        btn.classList.toggle("bg-violet-600", on);
        btn.classList.toggle("text-white", on);
        btn.classList.toggle("text-slate-400", !on);
      });
    }

    function setView(mode) {
      viewMode = mode;
      localStorage.setItem("hssim_view", mode);
      renderLessons();
    }

    // re-render cards whenever the language flips
    window.onLangChange = renderLessons;

    HSSIM.mount({ home: true, icon: "fa-infinity" });
    renderLessons();
  </script>
  <!-- tiny corner feedback widget (self-contained) -->
  <script src="assets/feedback.js" defer></script>
</body>
</html>
