    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height, M = 50;
    let n = 8;

    function buildSquares(count) {
      const fib = [1, 1];
      while (fib.length < count) fib.push(fib[fib.length - 1] + fib[fib.length - 2]);
      const sq = [{ x: 0, y: 0, s: fib[0], dir: 'init' }];
      const rect = { x: 0, y: 0, w: fib[0], h: fib[0] };
      const dirs = ['right', 'top', 'left', 'bottom'];
      for (let k = 1; k < count; k++) {
        const dir = dirs[(k - 1) % 4];
        let s, nx, ny;
        if (dir === 'right') { s = rect.h; nx = rect.x + rect.w; ny = rect.y; rect.w += s; }
        else if (dir === 'top') { s = rect.w; nx = rect.x; ny = rect.y - s; rect.y -= s; rect.h += s; }
        else if (dir === 'left') { s = rect.h; nx = rect.x - s; ny = rect.y; rect.x -= s; rect.w += s; }
        else { s = rect.w; nx = rect.x; ny = rect.y + rect.h; rect.h += s; }
        sq.push({ x: nx, y: ny, s, dir });
      }
      return { sq, fib };
    }

    function render() {
      const { sq, fib } = buildSquares(n);
      // bounding box
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      sq.forEach(s => { x0 = Math.min(x0, s.x); y0 = Math.min(y0, s.y); x1 = Math.max(x1, s.x + s.s); y1 = Math.max(y1, s.y + s.s); });
      const scale = Math.min((W - 2 * M) / (x1 - x0), (H - 2 * M) / (y1 - y0));
      const ox = (W - (x1 - x0) * scale) / 2, oy = (H - (y1 - y0) * scale) / 2;
      const tx = x => ox + (x - x0) * scale, ty = y => oy + (y - y0) * scale;

      ctx.clearRect(0, 0, W, H);

      const showSq = document.getElementById('show-squares').checked;
      const showSp = document.getElementById('show-spiral').checked;

      if (showSq) {
        sq.forEach((s, i) => {
          const px = tx(s.x), py = ty(s.y), ps = s.s * scale;
          const hue = 90 + i * 18;
          ctx.fillStyle = `hsla(${hue},70%,55%,0.10)`;
          ctx.strokeStyle = `hsla(${hue},70%,60%,0.8)`;
          ctx.lineWidth = 2;
          ctx.fillRect(px, py, ps, ps); ctx.strokeRect(px, py, ps, ps);
          ctx.fillStyle = '#e2e8f0'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = `600 ${Math.min(34, ps / 2.2)}px 'Space Grotesk', sans-serif`;
          ctx.fillText(s.s, px + ps / 2, py + ps / 2);
        });
      }

      if (showSp) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
        ctx.shadowColor = 'rgba(251,191,36,0.4)'; ctx.shadowBlur = 12;
        // Tangent golden spiral: each 90° arc shares BOTH its endpoint and its
        // tangent with the next, so the whole thing strokes as one smooth curve.
        // Start at the first square's top-right corner, angle 180°, turning 90°
        // per square — a config where every arc centre lands on a square corner.
        let C = { x: sq[0].x + sq[0].s, y: sq[0].y };
        let th = Math.PI;
        const sweep = -1;
        ctx.beginPath();
        for (let k = 0; k < sq.length; k++) {
          const r = sq[k].s * scale;
          const th2 = th + sweep * Math.PI / 2;
          ctx.arc(tx(C.x), ty(C.y), r, th, th2, sweep < 0);
          const rn = k + 1 < sq.length ? sq[k + 1].s : sq[k].s;
          C = { x: C.x + (sq[k].s - rn) * Math.cos(th2), y: C.y + (sq[k].s - rn) * Math.sin(th2) };
          th = th2;
        }
        ctx.stroke();
        ctx.shadowBlur = 0;
      }

      // sequence + ratio
      document.getElementById('vn').textContent = n;
      document.getElementById('seq').textContent = fib.join(', ') + ' …';
      const last = fib[n - 1], prev = fib[n - 2] || 1;
      katex.render(`\\frac{${last}}{${prev}} = ${(last / prev).toFixed(5)} \\approx \\varphi = 1.61803\\ldots`,
        document.getElementById('f-ratio'), { throwOnError: false, displayMode: true });
    }

    document.getElementById('sn').oninput = e => { n = parseInt(e.target.value); render(); };
    document.getElementById('show-spiral').onchange = render;
    document.getElementById('show-squares').onchange = render;

    // ---- static illustrations for the "everyday life" cards ----
    function buildIllustrations() {
      // Sunflower: real phyllotaxis using the 137.5° golden angle
      const phyllo = document.getElementById('phyllo-svg');
      if (phyllo) {
        const golden = Math.PI * (3 - Math.sqrt(5)); // ≈ 137.507°
        const num = 150, c = 2.5; let s = '';
        for (let i = 0; i < num; i++) {
          const r = c * Math.sqrt(i), a = i * golden, t = i / num;
          s += `<circle cx="${(r * Math.cos(a)).toFixed(1)}" cy="${(r * Math.sin(a)).toFixed(1)}" r="${(1 + t).toFixed(2)}" fill="hsl(${(42 - t * 16).toFixed(0)},92%,${(52 + t * 10).toFixed(0)}%)"/>`;
        }
        phyllo.innerHTML = s;
      }
      // Pinecone / pineapple: two families of spirals crossing into rhombic scales
      const cone = document.getElementById('cone-svg');
      if (cone) {
        let s = '<defs><clipPath id="cclip"><ellipse cx="60" cy="38" rx="24" ry="30"/></clipPath></defs>';
        s += '<ellipse cx="60" cy="38" rx="24" ry="30" fill="rgba(16,185,129,0.08)" stroke="#34d399" stroke-width="1.5"/>';
        s += '<g clip-path="url(#cclip)" stroke="#6ee7b7" stroke-width="1" opacity="0.7">';
        for (let x = 4; x < 162; x += 7) s += `<line x1="${x}" y1="2" x2="${x - 72}" y2="74"/>`;
        for (let x = -42; x < 120; x += 7) s += `<line x1="${x}" y1="2" x2="${x + 72}" y2="74"/>`;
        s += '</g>';
        cone.innerHTML = s;
      }
      // Nautilus: a logarithmic spiral that grows by φ every quarter turn
      const shell = document.getElementById('shell-svg');
      if (shell) {
        const b = Math.log(1.61803) / (Math.PI / 2);
        const pts = [];
        for (let th = 0; th <= 4.4 * Math.PI; th += 0.12) { const r = Math.exp(b * th); pts.push([r * Math.cos(th), r * Math.sin(th)]); }
        const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
        const minx = Math.min(...xs), maxx = Math.max(...xs), miny = Math.min(...ys), maxy = Math.max(...ys);
        const sc = Math.min(104 / (maxx - minx), 60 / (maxy - miny));
        const ox = 60 - (minx + maxx) / 2 * sc, oy = 36 - (miny + maxy) / 2 * sc;
        const d = pts.map((p, i) => `${i ? 'L' : 'M'} ${(ox + p[0] * sc).toFixed(1)} ${(oy + p[1] * sc).toFixed(1)}`).join(' ');
        shell.innerHTML = `<path d="${d}" fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
      }
    }

    window.onLangChange = render;
    HSSIM.mount({ icon: 'fa-spinner', gradient: 'from-lime-500 to-emerald-500' });
    render();
    buildIllustrations();
  </script>
</body>
