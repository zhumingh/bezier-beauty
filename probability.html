  <script>
    HSSIM.registerDict({

        stats_title: "战绩", total: "已落下", paths: "每个球有多少条路",

        concept_title: "说人话就是",
        concept: "小球落进第几个格子，概率服从“二项分布” C(n, i) / 2ⁿ。球越多、层数越多，它就越接近大名鼎鼎的正态分布（钟形曲线）。意思是：哪怕每一步都纯靠掷硬币，海量随机事件叠在一起，最后会冒出一个稳得离谱的规律——这正是整个统计学站得住脚的原因。考试分数、身高、各种误差，几乎都长这个样。",
        apps_kicker: "它都藏在哪儿",
        apps_title: "这座钟形山其实无处不在",

        app_a_title: "考试分布",
        app_a_desc: "全年级的成绩摊开看，大多挤在平均分附近，两头都是少数——标准钟形。",
        app_b_title: "保险公司",
        app_b_desc: "保险公司不知道谁会出事，却知道总体概率长什么样，于是保费定得稳赚不赔。",
        app_c_title: "工厂抽检",
        app_c_desc: "每包薯片克重不可能完全一样。只要分布形状对、偏差够小，整条生产线就算合格。",

        app_d_desc: "问 1000 个人就敢预测几亿人怎么投票，±3% 的误差范围就是从这套数学里算出来的。",
        ref_kicker: "想再多看一眼",

        ref_b_desc: "Math Is Fun 的互动钉板（Quincunx），点一下就能丢，越丢越像钟形。",

        ref_c_desc: "为什么身高、分数都长成钟形？“68–95–99.7”又是什么意思。",

      },
      en: {
        page_title: "Pure chaos, weirdly organized · HSSIM", nav_title: "Luck has a pattern", nav_subtitle: "where the bell curve hides",
        kicker: "THE TRUTH ABOUT LUCK", title: "Pure chaos, weirdly organized",
        intro: "Every ball hits a peg and goes left or right on a coin flip — pure luck. But once hundreds of balls pile up, they always build the same gorgeous bell-shaped hill.",
        controls: "Let's go", drop1: "Drop 1", drop50: "Drop 50", auto: "Keep dropping", stop: "Stop", reset: "Clear",
        rows: "Rows of pegs", show_ideal: "draw the textbook curve",
        stats_title: "Scoreboard", total: "Dropped", paths: "Paths per ball",
        formal_name: "Probability · the Binomial & Normal Distributions",
        concept_title: "OK, the gist",
        concept: "Which bin a ball lands in follows the 'binomial distribution' C(n, i) / 2ⁿ. More balls and more rows push it closer and closer to the famous normal distribution (bell curve). Translation: even when every step is a pure coin flip, a huge pile of random events produces a suspiciously reliable pattern — which is exactly why statistics works. Test scores, heights, measurement errors: nearly all bell-shaped.",
        apps_kicker: "WHERE IT'S SECRETLY HIDING",
        apps_title: "This bell-shaped hill is secretly everywhere",
        apps_subtitle: "Pile up enough little random things and the same shape pops out every time.",
        app_a_title: "Exam scores",
        app_a_desc: "Spread out a whole grade's scores: most huddle near the average, a few sit at each end — a textbook bell.",
        app_b_title: "Insurance math",
        app_b_desc: "Insurers can't know who will crash — but they know the distribution exactly, so premiums are priced to win.",
        app_c_title: "Quality control",
        app_c_desc: "No two chip bags weigh exactly the same. As long as the bell is the right shape and width, the line passes.",
        app_d_title: "Polling error",
        app_d_desc: "Ask 1,000 people, predict millions of votes. That ±3% margin comes straight from this math.",
        ref_kicker: "DIVE DEEPER",
        ref_title: "Want to go further?",
        ref_subtitle: "If the pegboard building a bell shape surprised you, these go further.",
        ref_for: "for Sunday",
        ref_a_tag: "VIDEO · YouTube",
        ref_a_title: "A real Galton board in action",
        ref_a_desc: "Thousands of beads pour down and pile up into the bell curve — for real, not a simulation.",
        ref_b_tag: "PLAY · Math Is Fun",
        ref_b_title: "Drop balls on the Quincunx",
        ref_b_desc: "Math Is Fun's interactive bean machine — keep dropping and watch the bell appear.",
        ref_c_tag: "READ · Math Is Fun",
        ref_c_title: "The Normal Distribution, explained",
        ref_c_desc: "Why heights and test scores are bell-shaped — and what 68–95–99.7 actually means.",
        ref_d_tag: "REFERENCE · Wikipedia",
        ref_d_title: "Galton board (Wikipedia)",
        ref_d_desc: "Who invented it, how it works, and its link to the famous central limit theorem.",

    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    let rows = 10;
    const cx = W / 2, topY = 90, rowGap = 34, gapX = 46;
    let bins = new Array(rows + 1).fill(0);
    let balls = [];
    let total = 0, autoOn = false, raf = null, lastTs = 0;
    const binBottom = H - 40;

    const pegX = (i, j) => cx + (j - i / 2) * gapX;
    const pegY = i => topY + i * rowGap;
    const binCenterX = i => cx + (i - rows / 2) * gapX;

    function logFact(n) { let s = 0; for (let i = 2; i <= n; i++) s += Math.log(i); return s; }
    function binom(n, k) { return Math.exp(logFact(n) - logFact(k) - logFact(n - k)); }

    function newBall() {
      const decisions = [];
      for (let i = 0; i < rows; i++) decisions.push(Math.random() < 0.5 ? 0 : 1);
      balls.push({ decisions, level: 0, t: 0 });
    }

    function step(dt) {
      const speed = 4.5; // levels per second
      for (const b of balls) {
        b.t += dt * speed;
        while (b.t >= 1 && b.level < rows) { b.t -= 1; b.level++; }
        if (b.level >= rows && b.t >= 1) b.landed = true;
      }
      balls.filter(b => b.landed).forEach(b => {
        const bin = b.decisions.reduce((a, c) => a + c, 0);
        bins[bin]++; total++;
      });
      balls = balls.filter(b => !b.landed);
    }

    function ballPos(b) {
      const sBefore = b.decisions.slice(0, b.level).reduce((a, c) => a + c, 0);
      if (b.level >= rows) {
        // dropping into bin
        const bin = sBefore;
        const x = binCenterX(bin);
        const y = pegY(rows - 1) + rowGap + b.t * (binBottom - (pegY(rows - 1) + rowGap));
        return { x, y: Math.min(binBottom, y) };
      }
      const sAfter = sBefore + b.decisions[b.level];
      const x0 = b.level === 0 ? cx : pegX(b.level - 1, sBefore);
      const y0 = b.level === 0 ? topY - rowGap : pegY(b.level - 1);
      const x1 = pegX(b.level, sAfter), y1 = pegY(b.level);
      const tt = b.t;
      return { x: x0 + (x1 - x0) * tt, y: y0 + (y1 - y0) * tt };
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // pegs
      ctx.fillStyle = '#475569';
      for (let i = 0; i < rows; i++) for (let j = 0; j <= i; j++) {
        ctx.beginPath(); ctx.arc(pegX(i, j), pegY(i), 3.5, 0, 7); ctx.fill();
      }
      // bins histogram
      const maxCount = Math.max(1, ...bins);
      const maxBarH = binBottom - (pegY(rows - 1) + rowGap + 14);
      for (let i = 0; i <= rows; i++) {
        const x = binCenterX(i), bw = gapX - 6;
        const bh = (bins[i] / maxCount) * maxBarH;
        const grad = ctx.createLinearGradient(0, binBottom - bh, 0, binBottom);
        grad.addColorStop(0, '#c084fc'); grad.addColorStop(1, '#7c3aed');
        ctx.fillStyle = grad;
        ctx.fillRect(x - bw / 2, binBottom - bh, bw, bh);
        ctx.fillStyle = '#64748b'; ctx.font = '10px monospace'; ctx.textAlign = 'center';
        if (bins[i] > 0) ctx.fillText(bins[i], x, binBottom - bh - 4);
      }
      // ideal bell curve
      if (document.getElementById('show-ideal').checked && total > 0) {
        ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 2.5; ctx.beginPath();
        for (let i = 0; i <= rows; i++) {
          const p = binom(rows, i) / Math.pow(2, rows);
          const expected = p * total;
          const bh = (expected / maxCount) * maxBarH;
          const x = binCenterX(i), y = binBottom - bh;
          i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
        }
        ctx.stroke();
      }
      // balls
      ctx.fillStyle = '#f43f5e';
      for (const b of balls) { const p = ballPos(b); ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, 7); ctx.fill(); }
      document.getElementById('r-total').textContent = total;
    }

    function loop(ts) {
      if (!lastTs) lastTs = ts;
      const dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
      if (autoOn && balls.length < 60) newBall();
      step(dt); draw();
      if (balls.length || autoOn) { raf = requestAnimationFrame(loop); }
      else { raf = null; lastTs = 0; }
    }
    function ensureLoop() { if (!raf) { lastTs = 0; raf = requestAnimationFrame(loop); } }

    document.getElementById('drop1').onclick = () => { newBall(); ensureLoop(); };
    document.getElementById('drop50').onclick = () => { for (let i = 0; i < 50; i++) newBall(); ensureLoop(); };
    document.getElementById('auto').onclick = e => {
      autoOn = !autoOn;
      e.target.textContent = HSSIM.t(autoOn ? 'stop' : 'auto');
      e.target.classList.toggle('bg-violet-600', autoOn);
      if (autoOn) ensureLoop();
    };
    document.getElementById('reset').onclick = () => { bins = new Array(rows + 1).fill(0); balls = []; total = 0; draw(); };
    document.getElementById('show-ideal').onchange = draw;
    document.getElementById('srows').oninput = e => {
      rows = parseInt(e.target.value); bins = new Array(rows + 1).fill(0); balls = []; total = 0;
      document.getElementById('vr').textContent = rows;
      document.getElementById('r-paths').textContent = Math.pow(2, rows).toLocaleString();
      draw();
    };

    function refreshStatic() {
      document.getElementById('vr').textContent = rows;
      document.getElementById('r-paths').textContent = Math.pow(2, rows).toLocaleString();
    }
    window.onLangChange = () => { document.getElementById('auto').textContent = HSSIM.t(autoOn ? 'stop' : 'auto'); };
    HSSIM.mount({ icon: 'fa-dice', gradient: 'from-fuchsia-500 to-purple-500', apps: [
      { icon: 'fa-graduation-cap', grad: 'from-sky-500 to-blue-500', k: 'app_a' },
      { icon: 'fa-shield-halved', grad: 'from-emerald-500 to-teal-500', k: 'app_b' },
      { icon: 'fa-industry', grad: 'from-amber-500 to-orange-500', k: 'app_c' },
      { icon: 'fa-square-poll-vertical', grad: 'from-rose-500 to-pink-500', k: 'app_d' },
    ] });
    refreshStatic(); draw();
  </script>
