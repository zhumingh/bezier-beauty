  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="assets/hssim.js"></script>
  <script>
    HSSIM.registerDict({
      zh: {
        page_title: "两条线的相遇现场 · HSSIM", nav_title: "两条线", nav_subtitle: "它们在哪儿撞上",
        kicker: "两条线的故事", title: "两条线的相遇现场",
        intro: "拖动每条线上的圆点。看它们多陡、从哪儿起步，最关键的是——它俩到底在哪儿撞上。",
        formula_title: "两条线的方程", line1: "线 1（紫）", line2: "线 2（青）", slope: "陡不陡 m", yint: "起点高度 b",
        sol_one: (x, y) => `撞上啦！就在 (${x}, ${y})`,
        sol_parallel: "两条平行线，这辈子都遇不上（无解）。",
        sol_same: "其实是同一条线，处处都重合（无穷多解）。",
        formal_name: "一次函数与二元一次方程组",
        concept_title: "说人话就是",
        concept: "y = mx + b 画出来就是一条直线：m 表示它有多陡（往右走一步往上跳多高），b 是它从 y 轴哪儿出发。把两条这样的方程摆一起，就叫“方程组”。它俩交叉的那个点同时满足两条线，所以那一点就是答案。平行线永远撞不上（无解）；要是俩其实是同一条线，那处处都算撞上（无穷多解）。",
        apps_kicker: "它都藏在哪儿",
        apps_title: "两条线打架，生活里天天有",
        apps_subtitle: "哪边更划算、什么时候回本——答案几乎都藏在两条直线的交点上。",
        app_a_title: "选手机套餐",
        app_a_desc: "月租贵但流量便宜 vs 月租便宜但流量贵——两条费用线的交点，就是你的换套餐时机。",
        app_b_title: "奶茶店回本点",
        app_b_desc: "开一家奶茶店：成本线和收入线相交的那一天，叫回本。老板们管它叫盈亏平衡点。",
        app_c_title: "供需定价",
        app_c_desc: "供给线和需求线一相交，市场价格就定了。经济学第一课画的就是这两条线。",
        app_d_title: "追及问题",
        app_d_desc: "你先走、我后追，什么时候追上？两条位置-时间直线的交点就是会合现场。",
        ref_kicker: "想再多看一眼",
        ref_title: "继续往下玩",
        ref_subtitle: "两条线在哪儿相遇，背后其实是一整门超有用的数学。",
        ref_for: "送给 Sunday",
        ref_a_tag: "视频 · 3Blue1Brown",
        ref_a_title: "线性代数的本质（动画神作）",
        ref_a_desc: "等你长大一点再看：用最美的动画讲清方程组背后的几何。有点难，但很震撼。",
        ref_b_tag: "入门 · Math Is Fun",
        ref_b_title: "二元方程组，慢慢讲",
        ref_b_desc: "图解、代入、消元，三种解法一次讲明白。",
        ref_c_tag: "动手玩 · Desmos",
        ref_c_title: "画两条线，找交点",
        ref_c_desc: "在 Desmos 里输入两条 y=mx+b，拖一拖，看它们到底在哪相遇。",
        ref_d_tag: "百科 · Wikipedia",
        ref_d_title: "线性方程组（维基百科）",
        ref_d_desc: "想深挖时来这里：从两条线一直延伸到上百个未知数。",
      },
      en: {
        page_title: "Two lines walk into a graph… · HSSIM", nav_title: "Two lines", nav_subtitle: "where do they crash",
        kicker: "A TALE OF TWO LINES", title: "Two lines walk into a graph…",
        intro: "Drag the dots on each line. See how steep they are, where they start, and — the main event — where they crash into each other.",
        formula_title: "The two equations", line1: "Line 1 (violet)", line2: "Line 2 (teal)", slope: "steepness m", yint: "starting height b",
        sol_one: (x, y) => `They crash at (${x}, ${y})!`,
        sol_parallel: "Parallel lines — they'll never meet (no solution, sorry).",
        sol_same: "Same line, secretly — they overlap everywhere (infinite solutions).",
        formal_name: "Linear Functions & Systems of Equations",
        concept_title: "OK, the gist",
        concept: "y = mx + b draws a straight line: m is how steep it is (how high it jumps per step right) and b is where it starts on the y-axis. Stack two of these equations and you've got a 'system'. The point where they cross satisfies both lines at once, so that point is the answer. Parallel lines never meet (no solution); if they're secretly the same line, they meet everywhere (infinitely many).",
        apps_kicker: "WHERE IT'S SECRETLY HIDING",
        apps_title: "Two crossing lines run your daily life",
        apps_subtitle: "Which deal is better, when do you break even — the answer usually hides at the crossing point of two straight lines.",
        app_a_title: "Picking a phone plan",
        app_a_desc: "High base fee + cheap data vs the opposite — the crossing of the two cost lines tells you exactly when to switch.",
        app_b_title: "Break-even point",
        app_b_desc: "Open a bubble-tea shop: the day the revenue line crosses the cost line, you break even. Business folks live by this point.",
        app_c_title: "Supply meets demand",
        app_c_desc: "Where the supply line meets the demand line, the market price is born. It's the first picture in every economics class.",
        app_d_title: "The catch-up problem",
        app_d_desc: "You start first, I chase later — when do I catch you? The intersection of two position-time lines is the meeting spot.",
        ref_kicker: "DIVE DEEPER",
        ref_title: "Want to go further?",
        ref_subtitle: "Where two lines meet opens up a whole world of surprisingly useful math.",
        ref_for: "for Sunday",
        ref_a_tag: "VIDEO · 3Blue1Brown",
        ref_a_title: "Essence of Linear Algebra",
        ref_a_desc: "Save it for when you're a bit older: gorgeous animations on the geometry behind systems. Tough, but breathtaking.",
        ref_b_tag: "READ · Math Is Fun",
        ref_b_title: "Systems of equations, explained",
        ref_b_desc: "Graphing, substitution and elimination — all three methods, clearly laid out.",
        ref_c_tag: "PLAY · Desmos",
        ref_c_title: "Plot two lines, find the crossing",
        ref_c_desc: "Type two y=mx+b lines in Desmos and drag them to see exactly where they cross.",
        ref_d_tag: "REFERENCE · Wikipedia",
        ref_d_title: "System of linear equations (Wikipedia)",
        ref_d_desc: "For digging deeper: from two lines all the way to hundreds of unknowns.",
      },
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const XMIN = -10, XMAX = 10, YMIN = -8, YMAX = 8;
    const sx = W / (XMAX - XMIN), sy = H / (YMAX - YMIN);
    const px = x => (x - XMIN) * sx, py = y => H - (y - YMIN) * sy;
    const wx = X => X / sx + XMIN, wy = Y => (H - Y) / sy + YMIN;

    // each line is two world-space handles
    let lines = [
      { pts: [{ x: -6, y: -3 }, { x: 4, y: 4 }], color: '#a78bfa' },
      { pts: [{ x: -5, y: 5 }, { x: 6, y: -4 }], color: '#34d399' },
    ];
    let drag = null;

    const fmt = n => (Math.round(n * 100) / 100).toString();
    const slope = l => (l.pts[1].y - l.pts[0].y) / ((l.pts[1].x - l.pts[0].x) || 1e-9);
    const yint = l => l.pts[0].y - slope(l) * l.pts[0].x;

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = '#1e2937'; ctx.lineWidth = 1;
      for (let x = Math.ceil(XMIN); x <= XMAX; x++) { ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), H); ctx.stroke(); }
      for (let y = Math.ceil(YMIN); y <= YMAX; y++) { ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(W, py(y)); ctx.stroke(); }
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.stroke();

      lines.forEach(l => {
        const m = slope(l), b = yint(l);
        ctx.strokeStyle = l.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
        ctx.shadowColor = l.color + '55'; ctx.shadowBlur = 12;
        ctx.beginPath();
        ctx.moveTo(px(XMIN), py(m * XMIN + b));
        ctx.lineTo(px(XMAX), py(m * XMAX + b));
        ctx.stroke(); ctx.shadowBlur = 0;
        l.pts.forEach(p => {
          ctx.fillStyle = l.color; ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 10, 0, 7); ctx.fill();
          ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.arc(px(p.x), py(p.y), 5, 0, 7); ctx.fill();
        });
      });

      // intersection
      const m1 = slope(lines[0]), b1 = yint(lines[0]), m2 = slope(lines[1]), b2 = yint(lines[1]);
      if (Math.abs(m1 - m2) > 1e-6) {
        const xi = (b2 - b1) / (m1 - m2), yi = m1 * xi + b1;
        ctx.fillStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(px(xi), py(yi), 7, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      }
    }

    function render() {
      const m1 = slope(lines[0]), b1 = yint(lines[0]), m2 = slope(lines[1]), b2 = yint(lines[1]);
      document.getElementById('m1').textContent = fmt(m1);
      document.getElementById('b1').textContent = fmt(b1);
      document.getElementById('m2').textContent = fmt(m2);
      document.getElementById('b2').textContent = fmt(b2);
      katex.render(
        `\\begin{cases} y = ${fmt(m1)}x ${b1 < 0 ? '-' : '+'} ${fmt(Math.abs(b1))} \\\\ y = ${fmt(m2)}x ${b2 < 0 ? '-' : '+'} ${fmt(Math.abs(b2))} \\end{cases}`,
        document.getElementById('f-system'), { throwOnError: false, displayMode: true });
      const sol = document.getElementById('f-solution');
      if (Math.abs(m1 - m2) > 1e-6) {
        const xi = (b2 - b1) / (m1 - m2), yi = m1 * xi + b1;
        sol.innerHTML = `<span class="text-white font-medium">${HSSIM.t('sol_one', fmt(xi), fmt(yi))}</span>`;
      } else if (Math.abs(b1 - b2) < 1e-6) {
        sol.textContent = HSSIM.t('sol_same');
      } else {
        sol.textContent = HSSIM.t('sol_parallel');
      }
      draw();
    }

    function hit(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (H / rect.height);
      for (let li = 0; li < lines.length; li++)
        for (let pi = 0; pi < 2; pi++) {
          const p = lines[li].pts[pi];
          if (Math.hypot(mx - px(p.x), my - py(p.y)) < 20) return { li, pi };
        }
      return null;
    }
    function move(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width), my = (e.clientY - rect.top) * (H / rect.height);
      const p = lines[drag.li].pts[drag.pi];
      p.x = Math.max(XMIN, Math.min(XMAX, Math.round(wx(mx) * 2) / 2));
      p.y = Math.max(YMIN, Math.min(YMAX, Math.round(wy(my) * 2) / 2));
      render();
    }
    canvas.addEventListener('mousedown', e => { drag = hit(e); });
    window.addEventListener('mousemove', e => { if (drag) move(e); });
    window.addEventListener('mouseup', () => drag = null);
    canvas.addEventListener('touchstart', e => { drag = hit(e.touches[0]); if (drag) e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (drag) { move(e.touches[0]); e.preventDefault(); } }, { passive: false });
    window.addEventListener('touchend', () => drag = null);

    window.onLangChange = render;
    HSSIM.mount({ icon: 'fa-slash', gradient: 'from-emerald-500 to-teal-500', apps: [
      { icon: 'fa-mobile-screen', grad: 'from-sky-500 to-blue-500', k: 'app_a' },
      { icon: 'fa-store', grad: 'from-amber-500 to-orange-500', k: 'app_b' },
      { icon: 'fa-scale-balanced', grad: 'from-emerald-500 to-teal-500', k: 'app_c' },
      { icon: 'fa-person-running', grad: 'from-rose-500 to-pink-500', k: 'app_d' },
    ] });
    render();
  </script>
