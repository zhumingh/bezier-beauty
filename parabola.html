  <script>
    HSSIM.registerDict({

        kicker: "为啥东西都这么飞", title: "为啥扔出去的东西都这么飞",
        intro: "拖那个白点，或者拨拨滑块。投篮、喷泉、跳水……所有被扔出去的东西，划出来的都是这条线。",
        formula_title: "现场公式", vertex_form: "顶点式", standard_form: "展开式",
        controls: "三个旋钮", param_a: "a：胖瘦 & 朝上还朝下", param_h: "h：往左往右挪", param_k: "k：往上往下挪",

        controls: "Three knobs", param_a: "a: chunky vs skinny (and which way it opens)", param_h: "h: slide left / right", param_k: "k: slide up / down",

        readout_title: "Live stats", r_vertex: "Tip (top/bottom)", r_axis: "Middle line", r_open: "Opens", r_roots: "Landing spots", r_yint: "Hits the y-axis at",
        open_up: "up", open_down: "down", no_real: "never lands (flying too high)",
        formal_name: "Quadratic Functions & the Parabola",

        concept: "Every quadratic draws this same arc — a parabola. Vertex form y = a(x−h)² + k is the friendly one: it straight-up tells you the highest/lowest point is at (h, k). h moves it sideways, k moves it up/down, and a decides which way it opens and how chunky it is. Expand it and you get the textbook y = ax² + bx + c. Where the arc touches the x-axis = the answers (a.k.a. roots).",

        ref_title: "Want to go further?",
        ref_subtitle: "Free throws, fountains, dives — they all draw this curve. See where else it hides.",
        ref_for: "for Sunday",
        ref_a_tag: "VIDEO · YouTube",
        ref_a_title: "Parabolas in football (the science)",
        ref_a_desc: "From NSF × NFL: why every thrown pass traces a perfect parabola.",
        ref_b_tag: "READ · Math Is Fun",
        ref_b_title: "The Parabola, explained",
        ref_b_desc: "Focus, directrix and vertex made clear — and why satellite dishes are parabolas too.",
        ref_c_tag: "PLAY · Desmos",
        ref_c_title: "Bend your own parabola",
        ref_c_desc: "Type y=a(x−h)²+k in Desmos and drag the sliders to fatten, flip and slide it.",
        ref_d_tag: "REFERENCE · Wikipedia",
        ref_d_title: "Parabola (Wikipedia)",
        ref_d_desc: "From ancient Greece to rocket trajectories — the full story of the parabola.",
      },
    });

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const XMIN = -10, XMAX = 10, YMIN = -8, YMAX = 8;
    const sx = W / (XMAX - XMIN), sy = H / (YMAX - YMIN);
    const px = x => (x - XMIN) * sx;
    const py = y => H - (y - YMIN) * sy;
    const wx = X => X / sx + XMIN;
    const wy = Y => (H - Y) / sy + YMIN;

    let a = 0.5, h = 0, k = -3;
    let dragging = false;

    function fmt(n) { return (Math.round(n * 100) / 100).toString(); }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      // grid
      ctx.strokeStyle = '#1e2937'; ctx.lineWidth = 1;
      for (let x = Math.ceil(XMIN); x <= XMAX; x++) { ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), H); ctx.stroke(); }
      for (let y = Math.ceil(YMIN); y <= YMAX; y++) { ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(W, py(y)); ctx.stroke(); }
      // axes
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.stroke();

      // axis of symmetry
      ctx.strokeStyle = 'rgba(244,114,182,0.5)'; ctx.lineWidth = 1.5; ctx.setLineDash([5, 5]);
      ctx.beginPath(); ctx.moveTo(px(h), 0); ctx.lineTo(px(h), H); ctx.stroke(); ctx.setLineDash([]);

      // parabola
      ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 4; ctx.lineJoin = 'round';
      ctx.shadowColor = 'rgba(56,189,248,0.4)'; ctx.shadowBlur = 16;
      ctx.beginPath();
      let started = false;
      for (let X = 0; X <= W; X += 3) {
        const xv = wx(X), yv = a * (xv - h) * (xv - h) + k;
        const Y = py(yv);
        if (!started) { ctx.moveTo(X, Y); started = true; } else ctx.lineTo(X, Y);
      }
      ctx.stroke(); ctx.shadowBlur = 0;

      // roots
      const disc = -k / a;
      if (a !== 0 && disc >= 0) {
        const r = Math.sqrt(disc);
        [h - r, h + r].forEach(rx => {
          ctx.fillStyle = '#fbbf24';
          ctx.beginPath(); ctx.arc(px(rx), py(0), 6, 0, 7); ctx.fill();
        });
      }
      // y-intercept
      const yint = a * h * h + k;
      ctx.fillStyle = '#34d399';
      ctx.beginPath(); ctx.arc(px(0), py(yint), 5, 0, 7); ctx.fill();

      // vertex
      ctx.fillStyle = '#f472b6';
      ctx.beginPath(); ctx.arc(px(h), py(k), 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(px(h), py(k), 5, 0, 7); ctx.fill();
    }

    function renderFormulas() {
      const b = -2 * a * h, c = a * h * h + k;
      katex.render(`y = ${fmt(a)}\\,(x ${h <= 0 ? '+' : '-'} ${fmt(Math.abs(h))})^2 ${k < 0 ? '-' : '+'} ${fmt(Math.abs(k))}`,
        document.getElementById('f-vertex'), { throwOnError: false, displayMode: true });
      katex.render(`y = ${fmt(a)}x^2 ${b < 0 ? '-' : '+'} ${fmt(Math.abs(b))}x ${c < 0 ? '-' : '+'} ${fmt(Math.abs(c))}`,
        document.getElementById('f-standard'), { throwOnError: false, displayMode: true });
    }

    function update() {
      document.getElementById('va').textContent = fmt(a);
      document.getElementById('vh').textContent = fmt(h);
      document.getElementById('vk').textContent = fmt(k);
      document.getElementById('r-vertex').textContent = `(${fmt(h)}, ${fmt(k)})`;
      document.getElementById('r-axis').textContent = `x = ${fmt(h)}`;
      document.getElementById('r-open').textContent = a >= 0 ? HSSIM.t('open_up') : HSSIM.t('open_down');
      const disc = -k / a;
      if (a !== 0 && disc >= 0) {
        const r = Math.sqrt(disc);
        document.getElementById('r-roots').textContent = `${fmt(h - r)}, ${fmt(h + r)}`;
      } else { document.getElementById('r-roots').textContent = HSSIM.t('no_real'); }
      document.getElementById('r-yint').textContent = fmt(a * h * h + k);
      draw(); renderFormulas();
    }

    function syncSliders() {
      document.getElementById('sa').value = a;
      document.getElementById('sh').value = h;
      document.getElementById('sk').value = k;
    }

    document.getElementById('sa').oninput = e => { a = parseFloat(e.target.value) || 0.0001; update(); };
    document.getElementById('sh').oninput = e => { h = parseFloat(e.target.value); update(); };
    document.getElementById('sk').oninput = e => { k = parseFloat(e.target.value); update(); };

    function vertexHit(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      return Math.hypot(mx - px(h), my - py(k)) < 22;
    }
    function moveVertex(e) {
      const rect = canvas.getBoundingClientRect();
      const mx = (e.clientX - rect.left) * (W / rect.width);
      const my = (e.clientY - rect.top) * (H / rect.height);
      h = Math.max(XMIN, Math.min(XMAX, Math.round(wx(mx) * 2) / 2));
      k = Math.max(YMIN, Math.min(YMAX, Math.round(wy(my) * 2) / 2));
      syncSliders(); update();
    }
    canvas.addEventListener('mousedown', e => { if (vertexHit(e)) { dragging = true; } });
    window.addEventListener('mousemove', e => { if (dragging) moveVertex(e); });
    window.addEventListener('mouseup', () => dragging = false);
    canvas.addEventListener('touchstart', e => { if (vertexHit(e.touches[0])) { dragging = true; e.preventDefault(); } }, { passive: false });
    canvas.addEventListener('touchmove', e => { if (dragging) { moveVertex(e.touches[0]); e.preventDefault(); } }, { passive: false });
    window.addEventListener('touchend', () => dragging = false);

    window.onLangChange = update;
    HSSIM.mount({ icon: 'fa-chart-line', gradient: 'from-sky-500 to-cyan-500' });
    syncSliders(); update();
  </script>
