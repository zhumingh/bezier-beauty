            <div>
              <div class="flex justify-between text-xs mb-1"><span data-i18n="p_a">a（纵向拉伸 / 翻转）</span><span id="va" class="font-mono text-violet-400"></span></div>

            <div>

            </div>
            <div>
              <div class="flex justify-between text-xs mb-1"><span data-i18n="p_h">h（左右平移）</span><span id="vh" class="font-mono text-violet-400"></span></div>
              <input type="range" id="sh" min="-6" max="6" step="0.1" value="0" class="w-full">

            <div>
              <div class="flex justify-between text-xs mb-1"><span data-i18n="p_k">k（上下平移）</span><span id="vk" class="font-mono text-violet-400"></span></div>
              <input type="range" id="sk" min="-6" max="6" step="0.1" value="0" class="w-full">

            <div class="flex items-center gap-x-2"><i class="fa-brands fa-wikipedia-w text-slate-300"></i><span class="text-sm font-semibold" data-i18n="ref_d_title"></span></div>

  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script src="assets/hssim.js"></script>
  <script>
    HSSIM.registerDict({
      zh: {
        page_title: "给曲线做个整容 · HSSIM", nav_title: "曲线整容", nav_subtitle: "推拉翻拉随你",
        kicker: "曲线整容现场", title: "给曲线做个整容",
        intro: "先挑一条原版曲线，再拖滑块把它推、翻、拉。淡淡的是原版，发光的是你整完的样子。",
        formula_title: "整完长这样", parent: "原版曲线 f(x)", controls: "a · f( b(x − h) ) + k",
        p_a: "a：拉高拉扁 / 上下翻", p_b: "b：左右挤 / 左右翻", p_h: "h：左右挪", p_k: "k：上下挪", reset: "还原",
        formal_name: "函数图像变换 · 平移 / 伸缩 / 反射",
        concept_title: "说人话就是",
        concept: "任何函数都能用同一套招式改造：a 把它拉高或压扁，a 是负的就上下翻个面；b 把它左右挤，b 是负的就左右照镜子；h 让它左右挪（注意是 x − h）；k 让它上下挪。记住这四个旋钮，几乎所有曲线图你都能一眼看穿它做了啥。",
        apps_kicker: "它都藏在哪儿",
        apps_title: "平移翻转，其实天天在用",
        apps_subtitle: "只要有图像被挪动、放大、镜像，就是函数变换在干活。",
        app_a_title: "修图与缩放",
        app_a_desc: "双指放大照片是伸缩，旋转裁剪是变换——修图软件的每个手势都是函数变换。",
        app_b_title: "游戏镜像",
        app_b_desc: "游戏角色往左走？美术只画朝右的，引擎一个 -x 反射就搞定另一半。",
        app_c_title: "歌曲升降调",
        app_c_desc: "把整首歌升两个 key，就是给声波函数做平移和伸缩。KTV 那个按钮背后全是它。",
        app_d_title: "数据归一化",
        app_d_desc: "机器学习先把数据平移到 0、压缩到 1 再训练——专业名字叫归一化，其实就是 f(x) 的平移加伸缩。",
        ref_kicker: "想再多看一眼",
        ref_title: "继续往下玩",
        ref_subtitle: "学会这四个旋钮，几乎所有函数图你都能一眼看穿。",
        ref_for: "送给 Sunday",
        ref_a_tag: "动手玩 · Desmos",
        ref_a_title: "给任意函数加滑块",
        ref_a_desc: "在 Desmos 里写 a·f(b(x−h))+k，四个滑块一拖，立刻看懂每个字母在管什么。",
        ref_b_tag: "入门 · Math Is Fun",
        ref_b_title: "函数变换，慢慢讲",
        ref_b_desc: "平移、翻转、拉伸、压缩，配图一次讲清楚。",
        ref_c_tag: "工具 · Math Is Fun",
        ref_c_title: "在线函数画图器",
        ref_c_desc: "输入任何函数就能画出来，自己试试加加减减会发生什么。",
        ref_d_tag: "百科 · Wikipedia",
        ref_d_title: "几何变换（维基百科）",
        ref_d_desc: "平移、缩放、反射、旋转……图形变换背后的完整体系。",
      },
      en: {
        page_title: "Give a graph a glow-up · HSSIM", nav_title: "Graph glow-up", nav_subtitle: "push, flip, stretch",
        kicker: "GRAPH GLOW-UP", title: "Give a graph a glow-up",
        intro: "Pick an original curve, then drag the sliders to push, flip and stretch it. The faint one is the original; the glowing one is your remix.",
        formula_title: "Your remix", parent: "Original f(x)", controls: "a · f( b(x − h) ) + k",
        p_a: "a: taller / flatter (negative = flip upside-down)", p_b: "b: squeeze sideways (negative = mirror)", p_h: "h: slide left / right", p_k: "k: slide up / down", reset: "Undo",
        formal_name: "Transformations of Functions · Translation / Scaling / Reflection",
        concept_title: "OK, the gist",
        concept: "Any function can be remixed with the same four moves: a makes it taller or flatter (and flips it upside-down when negative); b squeezes it sideways (and mirrors it when negative); h slides it left/right (mind the x − h); k slides it up/down. Learn these four knobs and you can read almost any graph at a glance.",
        apps_kicker: "WHERE IT'S SECRETLY HIDING",
        apps_title: "Shift, flip, stretch — you use them daily",
        apps_subtitle: "Every time a picture gets moved, zoomed or mirrored, a function transformation is on shift.",
        app_a_title: "Photo editing",
        app_a_desc: "Pinch-to-zoom is a scaling, crop-and-rotate is a transform — every gesture in a photo app is a function transformation.",
        app_b_title: "Game sprites",
        app_b_desc: "Characters walking left? Artists draw only the right-facing one — the engine flips it with a -x reflection.",
        app_c_title: "Changing the key",
        app_c_desc: "Transposing a song up two keys is shifting and scaling the sound wave — that karaoke button is pure function transformation.",
        app_d_title: "Normalizing data",
        app_d_desc: "Machine learning shifts data to 0 and squeezes it to 1 before training. Fancy name: normalization. Actual content: shift and stretch.",
        ref_kicker: "DIVE DEEPER",
        ref_title: "Want to go further?",
        ref_subtitle: "Master these four knobs and you can read almost any graph at a glance.",
        ref_for: "for Sunday",
        ref_a_tag: "PLAY · Desmos",
        ref_a_title: "Add sliders to any function",
        ref_a_desc: "Write a·f(b(x−h))+k in Desmos and drag four sliders to see exactly what each letter does.",
        ref_b_tag: "READ · Math Is Fun",
        ref_b_title: "Function Transformations, explained",
        ref_b_desc: "Shift, flip, stretch, squeeze — all of it, with clear pictures.",
        ref_c_tag: "TOOL · Math Is Fun",
        ref_c_title: "Function Grapher",
        ref_c_desc: "Type any function and graph it — try adding and subtracting bits to see what happens.",
        ref_d_tag: "REFERENCE · Wikipedia",
        ref_d_title: "Geometric transformation (Wikipedia)",
        ref_d_desc: "Translation, scaling, reflection, rotation — the full system behind moving shapes.",
      },
    });

    const PARENTS = {
      'x^2': { f: x => x * x, tex: 'x^2' },
      '|x|': { f: x => Math.abs(x), tex: '|x|' },
      'sqrt': { f: x => x >= 0 ? Math.sqrt(x) : NaN, tex: '\\sqrt{x}' },
      'x^3': { f: x => x * x * x / 4, tex: '\\tfrac{1}{4}x^3' },
      'sin': { f: x => 3 * Math.sin(x), tex: '3\\sin x' },
      '1/x': { f: x => x === 0 ? NaN : 3 / x, tex: '3/x' },
    };
    let parent = 'x^2';
    let a = 1, b = 1, h = 0, k = 0;

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    const XMIN = -10, XMAX = 10, YMIN = -8, YMAX = 8;
    const sx = W / (XMAX - XMIN), sy = H / (YMAX - YMIN);
    const px = x => (x - XMIN) * sx, py = y => H - (y - YMIN) * sy;
    const fmt = n => (Math.round(n * 100) / 100).toString();

    function plot(fn, color, width, faint) {
      ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineJoin = 'round';
      if (!faint) { ctx.shadowColor = color + '55'; ctx.shadowBlur = 14; }
      let pen = false;
      ctx.beginPath();
      for (let X = 0; X <= W; X += 2) {
        const xv = X / sx + XMIN, yv = fn(xv);
        if (!isFinite(yv) || yv < YMIN - 5 || yv > YMAX + 5) { pen = false; continue; }
        const Y = py(yv);
        if (!pen) { ctx.moveTo(X, Y); pen = true; } else ctx.lineTo(X, Y);
      }
      ctx.stroke(); ctx.shadowBlur = 0;
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.strokeStyle = '#1e2937'; ctx.lineWidth = 1;
      for (let x = Math.ceil(XMIN); x <= XMAX; x++) { ctx.beginPath(); ctx.moveTo(px(x), 0); ctx.lineTo(px(x), H); ctx.stroke(); }
      for (let y = Math.ceil(YMIN); y <= YMAX; y++) { ctx.beginPath(); ctx.moveTo(0, py(y)); ctx.lineTo(W, py(y)); ctx.stroke(); }
      ctx.strokeStyle = '#475569'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, py(0)); ctx.lineTo(W, py(0)); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(px(0), 0); ctx.lineTo(px(0), H); ctx.stroke();

      const f = PARENTS[parent].f;
      plot(f, 'rgba(148,163,184,0.45)', 2.5, true);            // parent faint
      plot(x => a * f(b * (x - h)) + k, '#818cf8', 4, false);  // transformed
    }

    function render() {
      document.getElementById('va').textContent = fmt(a);
      document.getElementById('vb').textContent = fmt(b);
      document.getElementById('vh').textContent = fmt(h);
      document.getElementById('vk').textContent = fmt(k);
      const t = PARENTS[parent].tex;
      const inner = `${fmt(b)}(x ${h <= 0 ? '+' : '-'} ${fmt(Math.abs(h))})`;
      katex.render(`g(x) = ${fmt(a)} f\\big(${inner}\\big) ${k < 0 ? '-' : '+'} ${fmt(Math.abs(k))}, \\quad f(x)=${t}`,
        document.getElementById('f-main'), { throwOnError: false, displayMode: true });
      draw();
    }

    function buildParents() {
      const box = document.getElementById('parents');
      box.innerHTML = Object.keys(PARENTS).map(key =>
        `<button data-p="${key}" class="px-3 py-2 rounded-2xl border text-center ${key === parent ? 'bg-violet-600 border-violet-500 text-white' : 'bg-slate-800 border-slate-600'}">$${PARENTS[key].tex}$</button>`
      ).join('');
      box.querySelectorAll('button').forEach(btn => {
        btn.onclick = () => { parent = btn.getAttribute('data-p'); buildParents(); render(); };
        try { katex.render(PARENTS[btn.getAttribute('data-p')].tex, btn, { throwOnError: false }); } catch (e) {}
      });
    }

    ['a', 'b', 'h', 'k'].forEach(p => {
      document.getElementById('s' + p).oninput = e => {
        const v = parseFloat(e.target.value);
        if (p === 'a') a = v; if (p === 'b') b = v; if (p === 'h') h = v; if (p === 'k') k = v;
        render();
      };
    });
    document.getElementById('reset').onclick = () => {
      a = 1; b = 1; h = 0; k = 0;
      document.getElementById('sa').value = 1; document.getElementById('sb').value = 1;
      document.getElementById('sh').value = 0; document.getElementById('sk').value = 0;
      render();
    };

    window.onLangChange = render;
    HSSIM.mount({ icon: 'fa-arrows-up-down-left-right', gradient: 'from-indigo-500 to-violet-500', apps: [
      { icon: 'fa-image', grad: 'from-sky-500 to-cyan-500', k: 'app_a' },
      { icon: 'fa-gamepad', grad: 'from-violet-500 to-fuchsia-500', k: 'app_b' },
      { icon: 'fa-music', grad: 'from-rose-500 to-pink-500', k: 'app_c' },
      { icon: 'fa-chart-line', grad: 'from-emerald-500 to-teal-500', k: 'app_d' },
    ] });
    buildParents(); render();
  </script>

  <script src="assets/feedback.js" defer></script>
